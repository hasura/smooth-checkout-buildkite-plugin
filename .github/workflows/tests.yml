name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Disposable checkout regression tests
        run: bash tests/cleanup.sh
      - name: run tests
        run: docker-compose run --rm tests
    
